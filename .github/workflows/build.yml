name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Check the app script
        run: npm run check

      - name: Prepare the web folder and icons
        run: |
          mkdir -p www assets
          cp index.html style.css app.js www/
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#a855f7' --iconBackgroundColorDark '#a855f7'
        continue-on-error: true

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AniVault.apk

      - name: Keep a copy with the build
        uses: actions/upload-artifact@v4
        with:
          name: AniVault-apk
          path: AniVault.apk
          if-no-files-found: error

      - name: Publish a direct download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AniVault APK (build ${{ github.run_number }})
          body: Download AniVault.apk below and install it on your Android phone.
          files: AniVault.apk
          make_latest: true
